name: Checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e './python[dev]'
      - run: python scripts/check.py
      - run: python -m pytest python/tests
      - run: mypy python/tests/typecheck.py
      - run: python scripts/examples.py python
      - run: python -m build python
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm --prefix typescript ci
      - run: npm --prefix typescript test
      - run: npm --prefix examples/typescript ci
      - run: python scripts/examples.py typescript
      - run: npm pack --dry-run
        working-directory: typescript
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -e './python[dev]'
      - run: npm --prefix typescript ci
      - run: python -m build python
      - run: python scripts/check_packages.py

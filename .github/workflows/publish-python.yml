name: Publish Python
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  checks:
    if: startsWith(github.event.release.tag_name, 'python-v')
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e './python[dev]'
      - run: python scripts/check.py python "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: python -m build python
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
